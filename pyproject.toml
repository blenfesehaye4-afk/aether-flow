[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-flow"
version = "0.1.0"
description = "⚙️ AetherFlow: Lightweight, event-driven DAG workflow orchestration engine & async task runner."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Blen Fesehaye", email = "blenfesehaye4@gmail.com" }
]
keywords = [
    "workflow",
    "dag",
    "task-orchestration",
    "asyncio",
    "event-sourcing",
    "pipeline",
    "distributed-systems",
    "cli"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
aether-flow = "aether_flow.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aether_flow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
